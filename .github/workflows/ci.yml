name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check all sources
        run: python -m py_compile $(git ls-files 'src/*.py')

      - name: Install test dependencies
        run: pip install hazm

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
